name: Generate new pictures

# Every Monday (or on demand) build a few new pictures and open a pull
# request. Nothing goes live until you merge it: merged files are served
# by GitHub Pages and picked up by the app.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: How many pictures to generate
        default: '3'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate
        run: python tool/generate.py --count "${{ github.event.inputs.count || '3' }}"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing new."; exit 0
          fi
          branch="new-pictures-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add catalog.json puzzles
          git commit -m "Add new pictures ($(date +%F))"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "New pictures $(date +%F)" \
            --body "Generated by the scheduled job. Open the thumbnails under \`puzzles/*/thumb.png\` to review. Merge to publish them to the app; close to discard."
